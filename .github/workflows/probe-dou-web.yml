name: probe-dou-web

# Sonda temporária: inspeciona o jsonArray do índice público do DOU
# (plano B para quando o INLabs cai). Não grava nada no repositório,
# não usa secrets.

on:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/probe-dou-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar jsonArray do índice
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for sec in do1 do2; do
            curl -sSL -m 60 -A "$UA" -o "$sec.html" "https://www.in.gov.br/leiturajornal?data=22-10-2026&secao=$sec"
          done
          python3 - <<'PY'
          import re, json
          for sec in ("do1", "do2"):
              t = open(f"{sec}.html", encoding="utf-8", errors="replace").read()
              m = re.search(r'<script[^>]*id="params"[^>]*>(.*?)</script>', t, re.S)
              print("===", sec, "bytes", len(t), "script#params:", bool(m))
              if not m:
                  i = t.find("jsonArray")
                  print("contexto jsonArray:", t[max(0, i-150): i+250].replace("\n", " "))
                  continue
              d = json.loads(m.group(1))
              print("chaves:", list(d.keys()))
              arr = d.get("jsonArray") or []
              print("itens:", len(arr))
              if arr:
                  print("campos do 1º item:", list(arr[0].keys()))
                  for it in arr[:3]:
                      print(json.dumps(it, ensure_ascii=False)[:500])
                  print("orgãos distintos (amostra):", sorted({str(x.get('hierarchyStr', ''))[:40] for x in arr})[:8])
          PY
