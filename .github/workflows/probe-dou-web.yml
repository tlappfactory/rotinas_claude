name: probe-dou-web

# Teste temporário (2ª rodada) do plano B com texto integral: roda fetch_dou_web.py +
# parse_dou.py em diretório temporário e imprime estatísticas.
# Não grava nada no repositório e não usa secrets.

on:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/probe-dou-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Coletar (texto integral) e filtrar
        env:
          DOU_ROOT: ${{ runner.temp }}/dou
          FETCH_LOG: ${{ runner.temp }}/fetch_dou_web.log
        run: |
          mkdir -p "$DOU_ROOT"
          start=$(date +%s)
          python scripts/fetch_dou_web.py 2026-10-26
          echo "coleta: $(( $(date +%s) - start ))s"
          python scripts/parse_dou.py --force
          python3 - <<'PY'
          import json, os, collections
          d = json.load(open(os.environ["DOU_ROOT"] + "/2026-10-26/inlabs-filtered.json"))
          arts = d["articles"]
          print("atos no índice:", d["total_xml_files"], "| selecionados:", d["matched_articles"],
                "| descartados (pessoal de outros órgãos):", d["discarded_individual_acts"]["total"])
          print("origem:", json.dumps(d["origem"], ensure_ascii=False))
          print("com texto parcial:", sum(a["texto_truncated"] for a in arts), "de", len(arts))
          L = [len(a["texto_resumo"]) for a in arts]
          print("tamanho do texto: min", min(L), "máx", max(L), "média", sum(L)//len(L))
          print("seções:", dict(collections.Counter(a["section"] for a in arts)))
          for a in arts[:5]:
              print("-", a["identifica"][:60], "|", a["orgao"][:40], "|", len(a["texto_resumo"]), "chars | kw:", a["strong_keywords"])
          PY
