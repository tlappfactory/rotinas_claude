name: fetch-dou-dejt-tcu-diario

on:
  schedule:
    # Passagem principal: 13:03 UTC ~= 10:03 Brasília (antes da sessão Claude
    # das 11h30); dias úteis. Janela escolhida porque (a) o INLabs já tem o
    # pacote do DOU consolidado às 10h BRT — versões mais cedo costumam
    # retornar 404/parcial; (b) o DEJT do dia tem publicação válida
    # (disponibilizado na véspera às 19h BRT); (c) ainda dá ~2h de folga até
    # o expediente da SGP começar (12h BRT). Minuto deslocado de :00 para
    # :03 de propósito: crons marcados para o topo da hora competem com o
    # maior volume de agendamentos de toda a plataforma do GitHub e por isso
    # sofrem mais fila/atraso — levantamento de 30 execuções mostrou runs de
    # "13:00 UTC" começando de fato entre 14:20 e 16:15 UTC.
    - cron: "3 13 * * 1-5"
    # Passagem de reforço, ~35 min depois da principal. Cobre tanto o atraso
    # do agendador do GitHub (jitter observado de 1h20 a mais de 3h — ver
    # acima) quanto falha pontual na passagem principal (ex.: instabilidade
    # de login no INLabs não resolvida mesmo com o retry de
    # scripts/fetch_inlabs.py). Custo extra é baixo quando a principal já
    # teve sucesso: download()/extract() em fetch_inlabs.py só verificam
    # presença dos ZIPs/XMLs do dia, e o passo de commit não gera commit
    # vazio (git diff --staged --quiet) — o job de reforço apenas confirma
    # que os dados já estão lá e termina rápido.
    - cron: "38 13 * * 1-5"
    # Reforços tardios (INLabs em manutenção costuma voltar em poucas horas):
    # só trabalham se o dia ainda estiver sem dados; senão terminam rápido.
    - cron: "33 15 * * 1-5"
    - cron: "3 17 * * 1-5"
    # Execução de sábado (principal + reforço): o DEJT disponibilizado sexta
    # ~19h tem publicação na segunda-feira (Lei 11.419/2006, art. 4º, §3º).
    # Sem este run, essa edição só seria capturada pelo cron de segunda —
    # janela apertada antes do boletim das 11h30. O run de sábado a deixa
    # commitada no bridge com o fim de semana inteiro de folga.
    - cron: "3 13 * * 6"
    - cron: "38 13 * * 6"
  workflow_dispatch:
    inputs:
      data:
        description: "Data alvo YYYY-MM-DD (vazio = hoje + catch-up)"
        required: false
      catchup:
        description: "Dias de catch-up quando 'data' está vazia"
        required: false
        default: "7"
      forcar_web:
        description: "Teste: pular o INLabs e usar só a coleta alternativa do DOU (true/false)"
        required: false
        default: "false"
      sonda_diarios:
        description: "Teste: rodar SÓ a coleta do DJEN/DJe-CNJ, sem commitar (diagnóstico de endpoints; true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: fetch-dou-dejt-tcu
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps (Python + poppler para PDF)
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Fetch INLabs (DOU XML)
        if: ${{ inputs.sonda_diarios != 'true' }}
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
          INPUT_DATA: ${{ inputs.data }}
          INPUT_CATCHUP: ${{ inputs.catchup || '7' }}
          FORCAR_WEB: ${{ inputs.forcar_web }}
        run: |
          mkdir -p dou logs
          # Plano B: se o INLabs falhar (manutenção, login), lê o índice público
          # do DOU (scripts/fetch_dou_web.py) — só a edição de INPUT_DATA ou de
          # hoje; não reconstrói edições anteriores. parse_dou.py registra a
          # origem no JSON.
          if [ "$FORCAR_WEB" = "true" ]; then
            echo "forcar_web=true: pulando o INLabs."
            python scripts/fetch_dou_web.py $INPUT_DATA
          elif [ -n "$INPUT_DATA" ]; then
            python scripts/fetch_inlabs.py "$INPUT_DATA" \
              || { echo "::warning::INLabs falhou; usando a coleta alternativa do DOU (índice público)."; python scripts/fetch_dou_web.py "$INPUT_DATA"; }
          else
            python scripts/fetch_inlabs.py --catchup "$INPUT_CATCHUP" \
              || { echo "::warning::INLabs falhou; usando a coleta alternativa do DOU (índice público)."; python scripts/fetch_dou_web.py; }
          fi

      - name: Parse DOU
        if: ${{ inputs.sonda_diarios != 'true' }}
        run: python scripts/parse_dou.py --force

      # Boletim SEGEST: mesmo material bruto (XMLs já extraídos), filtro temático
      # próprio (scripts/perfis.py) -> inlabs-filtered-segest.json.
      - name: Parse DOU (perfil SEGEST)
        if: ${{ inputs.sonda_diarios != 'true' }}
        env:
          BOLETIM_PERFIL: segest
        run: python scripts/parse_dou.py --force

      - name: Fetch DEJT (PDFs TRT-17 / CSJT / TST)
        if: ${{ inputs.sonda_diarios != 'true' }}
        env:
          # Convenção: o DEJT é disponibilizado às 19h Brasília do dia D-1 e
          # considerado PUBLICADO no primeiro dia útil seguinte (Lei 11.419/2006,
          # art. 4º, §3º). O cron das 09 UTC roda na manhã do dia útil de
          # publicação, então a publicação esperada é "hoje" (data UTC, o runner
          # do GitHub está em UTC; em casos extremos pré-dawn Brasília isso pode
          # divergir, mas o cron das 09 UTC garante alinhamento).
          # Se a publicação detectada for anterior à esperada, o script marca
          # `pdf_stale` em vez de `ok` — sinal para re-tentar mais tarde.
          # No run de sábado a publicação esperada é a data do sábado: a edição
          # de sexta tem publicação na segunda (futura), nunca anterior, então
          # nunca é falsamente marcada `pdf_stale`; é arquivada como `ok` na
          # pasta da sua data de publicação real (segunda-feira).
          DEJT_EXPECTED_PUBLICATION_DATE: ${{ inputs.data || '' }}
        run: |
          mkdir -p dejt
          # Sem `inputs.data` (cron diário), assume publicação esperada = hoje.
          if [ -z "$DEJT_EXPECTED_PUBLICATION_DATE" ]; then
            export DEJT_EXPECTED_PUBLICATION_DATE="$(date -u +%Y-%m-%d)"
          fi
          echo "Publicação esperada: $DEJT_EXPECTED_PUBLICATION_DATE"
          python scripts/fetch_dejt.py

      - name: Parse DEJT
        if: ${{ inputs.sonda_diarios != 'true' }}
        run: python scripts/parse_dejt.py --force

      - name: Parse DEJT (perfil SEGEST)
        if: ${{ inputs.sonda_diarios != 'true' }}
        env:
          BOLETIM_PERFIL: segest
        run: python scripts/parse_dejt.py --force

      - name: Fetch+filter TCU (acórdãos via API JSON dados-abertos)
        if: ${{ inputs.sonda_diarios != 'true' }}
        run: |
          mkdir -p tcu
          for perfil in sgp segest; do
            BOLETIM_PERFIL=$perfil python scripts/fetch_tcu.py --lookback 14 || \
              echo "AVISO: fetch_tcu.py ($perfil) falhou — TCU será marcado como fonte indisponível neste run."
          done

      - name: Fetch+filter STF/STJ (feeds oficiais de notícias — sinal de precedente vinculante)
        if: ${{ inputs.sonda_diarios != 'true' }}
        run: |
          mkdir -p jurisprudencia
          for perfil in sgp segest; do
            BOLETIM_PERFIL=$perfil python scripts/fetch_jurisprudencia.py --lookback 7 || \
              echo "AVISO: fetch_jurisprudencia.py ($perfil) falhou — STF/STJ seguem por busca complementar."
          done

      - name: Fetch+filter DJEN (CSJT) e DJe/CNJ
        # Lacuna fechada em 09/11/2026: acórdãos do CSJT no DJEN e decisões do
        # CNJ fora do DOU. Falha aqui não derruba o run; o status por fonte fica
        # no JSON (ok | no_feed | error) e `probe` guarda o HTTP de cada tentativa.
        run: |
          mkdir -p diarios
          for perfil in sgp segest; do
            BOLETIM_PERFIL=$perfil python scripts/fetch_diarios.py --lookback 4 || \
              echo "AVISO: fetch_diarios.py ($perfil) falhou — DJEN/DJe-CNJ serão marcados como fontes não consultadas."
          done

      - name: Fetch+filter notícias CNJ/CSJT/TST (perfil SEGEST)
        # Fonte nova (SEGEST): metas, estratégia, estatística, PLS, acessibilidade.
        # Falha não derruba o run; `status` por fonte fica no JSON.
        if: ${{ inputs.sonda_diarios != 'true' }}
        run: |
          mkdir -p institucional
          BOLETIM_PERFIL=segest python scripts/fetch_institucional.py --lookback 7 || \
            echo "AVISO: fetch_institucional.py falhou — notícias CNJ/CSJT/TST serão marcadas como não consultadas."

      - name: Commit JSONs filtrados
        if: ${{ inputs.sonda_diarios != 'true' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Um pathspec sem correspondência faria o git add falhar (set -e):
          # os JSONs "-segest" podem faltar se a fonte correspondente falhou.
          for pathspec in 'dou/*/inlabs-filtered.json' 'dou/*/inlabs-filtered-segest.json' \
                          'dejt/*/dejt-filtered.json' 'dejt/*/dejt-filtered-segest.json' 'dejt/_last_fetch.json' \
                          'tcu/*/tcu-filtered.json' 'tcu/*/tcu-filtered-segest.json' \
                          'jurisprudencia/*/jurisprudencia-filtered.json' 'jurisprudencia/*/jurisprudencia-filtered-segest.json' \
                          'diarios/*/diarios-filtered.json' 'diarios/*/diarios-filtered-segest.json' \
                          'institucional/*/institucional-filtered-segest.json'; do
            git add -- "$pathspec" 2>/dev/null || echo "sem arquivos para $pathspec"
          done
          if git diff --staged --quiet; then
            echo "Nenhuma novidade a commitar."
            exit 0
          fi
          git commit -m "DOU+DEJT+TCU filtrados — $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Push com tolerância a corrida (humano commitando no main entre o
          # checkout e o push). Tenta rebase em cima de origin/main e re-push.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "push ok na tentativa $attempt"
              exit 0
            fi
            echo "push falhou na tentativa $attempt; tentando rebase em origin/main"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep $((attempt*5)); }
          done
          echo "ERRO: 4 tentativas de push falharam." >&2
          exit 1

      - name: Upload de log (artefato)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fetch-log-${{ github.run_id }}
          path: logs/
          retention-days: 14
